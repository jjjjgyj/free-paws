name: Refresh listings and publish

on:
  schedule:
    - cron: "23 10 * * *"   # daily, about 5:23am New York time
  workflow_dispatch:         # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: python -m unittest discover tests

      - name: Refresh listings (no AI, standard library only)
        env:
          RESCUEGROUPS_API_KEY: ${{ secrets.RESCUEGROUPS_API_KEY }}
        run: python -m refresh

      - name: Commit listings only when they changed
        run: |
          git config user.name "free-paws-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/listings.json data/zipcache.json
          git diff --cached --quiet || (git commit -m "Refresh listings" && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
